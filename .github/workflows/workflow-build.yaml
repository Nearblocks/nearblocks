name: Build Docker Images
on:
  push:
    branches: ['backfill-accounts']
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/amd64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        id: build
        with:
          context: .
          file: apps/indexer-accounts/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/nearblocks/indexer-accounts:backfill-accounts
          cache-from: type=registry,ref=ghcr.io/nearblocks/indexer-accounts:backfill-accounts
          cache-to: type=inline
          build-args: |
            GITHUB_SHA=${{ github.sha }}
