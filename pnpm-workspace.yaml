packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  bufferutil: true
  core-js: false
  cpu-features: true
  esbuild: true
  fsevents: false
  protobufjs: true
  secp256k1: true
  sharp: true
  ssh2: true
  utf-8-validate: true
  workerd: true

catalog:
  '@aws-sdk/client-s3': 3.750.0
  '@near-js/jsonrpc-client': ~1.6.0
  '@near-js/jsonrpc-types': ~1.6.0
  '@noble/curves': 2.2.0
  '@scure/base': 1.2.5
  '@sentry/node': 7.120.0
  '@types/big.js': ~6.2.2
  '@types/express': ~4.17
  '@types/lodash-es': ~4.17
  '@types/node': ~24.19
  '@types/pg': ~8.11
  ahooks: ~3.9.7
  autoprefixer: ~10.4
  axios: 1.10.0
  borsh: ~2.0.0
  bs58: ~6.0.0
  dayjs: 1.11.13
  envalid: 8.1.0
  es-toolkit: ~1.46.1
  ethers: ~6.16.0
  express: 4.21.2
  hwp: ^0.4.1
  knex: 3.1.0
  knex-migrate-sql-file: ~2.0
  lodash-es: 4.17.21
  pg: 8.13.1
  pino: 9.6.0
  postcss: ~8.4
  prom-client: 15.1.3
  tsx: ~4.21
  typescript: ~6.0.3
  undici: 7.8.0
  valibot: 1.1.0
  vitest: ~3.0

overrides:
  react-singleton-hook: 4.0.1

packageExtensions:
  '@floating-ui/react-dom':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  '@marsidev/react-turnstile':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  '@remixicon/react':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'ahooks':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'cmdk':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'lucide-react':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'next':
    peerDependencies:
      '@types/react': '*'
      '@types/react-dom': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
      '@types/react-dom':
        optional: true
  'react-error-boundary':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'react-hook-form':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'sonner':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true
  'swr':
    peerDependencies:
      '@types/react': '*'
    peerDependenciesMeta:
      '@types/react':
        optional: true

minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.6'
  - '@turbo/darwin-arm64@2.11.6'
  - '@turbo/linux-64@2.11.6'
  - '@turbo/linux-arm64@2.11.6'
  - '@turbo/windows-64@2.11.6'
  - '@turbo/windows-arm64@2.11.6'
  - turbo@2.11.6
