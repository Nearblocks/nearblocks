version: '3.6'
services:
  backend:
    container_name: testnet-backend
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP: backend
        APT_PACKAGES: 'ca-certificates libssl-dev'
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: testnet.backend.env
