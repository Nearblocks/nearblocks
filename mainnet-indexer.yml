version: '3.6'
services:
  indexer-base:
    container_name: mainnet-indexer-base
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP: indexer-base
        APT_PACKAGES: 'ca-certificates git curl iputils-ping'
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: mainnet.indexer.env
  indexer-receipts:
    container_name: mainnet-indexer-receipts
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP: indexer-receipts
        NEON: true
        APT_PACKAGES: 'ca-certificates git curl iputils-ping'
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: mainnet.indexer.env
  indexer-events:
    container_name: mainnet-indexer-events
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP: indexer-events
        NEON: true
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: mainnet.indexer.env
  indexer-multichain:
    container_name: mainnet-indexer-multichain
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP: indexer-multichain
        NODE_ARGS: '--max-old-space-size=1536'
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: mainnet.indexer.env
  indexer-intents:
    container_name: mainnet-indexer-intents
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP: indexer-intents
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: mainnet.indexer.env
  indexer-staking:
    container_name: mainnet-indexer-staking
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP: indexer-staking
        NODE_ARGS: '--max-old-space-size=2048'
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: mainnet.indexer.env
  indexer-ft-state:
    container_name: mainnet-indexer-ft-state
    build:
      context: .
      dockerfile: ./Dockerfile
      args:
        APP: indexer-ft-state
    restart: always
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    env_file: mainnet.indexer.env

volumes:
  redis-data:
